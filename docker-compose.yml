services:
  flask-app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT}:5000"
    volumes:
      - ${PWD}:/app
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8082:8080"

volumes:
  pgdata:

